# Drivers this firmware needs from the SDK. Kept minimal on purpose: every
# component here is code in the image, and the STM32 build fitted in 62 KB.
CONFIG_MCUX_COMPONENT_driver.rgpio=y
CONFIG_MCUX_COMPONENT_driver.lpuart=y
CONFIG_MCUX_COMPONENT_driver.iomuxc=y
CONFIG_MCUX_COMPONENT_driver.cache_xcache=y
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_COMPONENT_driver.lpi2c=y
CONFIG_MCUX_COMPONENT_driver.lpspi=y
CONFIG_MCUX_COMPONENT_driver.i3c=y
CONFIG_MCUX_COMPONENT_driver.flexcan=y
CONFIG_MCUX_COMPONENT_driver.flexio=y
CONFIG_MCUX_COMPONENT_driver.netc=y
# USB device: select the EHCI controller and nothing else.
#
# EHCI is the high-speed controller; KHCI is full speed only and choosing it
# would cap the link at 12 Mbit/s regardless of what the descriptors claim.
#
# Only this one symbol is set. `device.stack`, `device.controller.driver`,
# `ehci_config_header` and `usb.phy` are all `select`ed by it and are not
# promptable - setting them directly is what made Kconfig refuse the first
# attempt. Let the dependency graph do its job.
# The entry point is the `usb.common_header` menuconfig, then the device half.
# `device.ehci`, `device.stack`, `device.controller.driver` and `usb.phy` all
# default on underneath and are NOT user-assignable - setting them directly is
# what made Kconfig refuse the first two attempts. Let the graph do its job.
CONFIG_MCUX_COMPONENT_middleware.usb.common_header=y
CONFIG_MCUX_COMPONENT_middleware.usb.device.common_header=y

# The EdgeLock Enclave base API is NOT enabled as a component here.
#
# devices/RT/RT1180/MIMXRT1189/drivers/fsl_ele_base_api.c is already in the
# build - the board's own init uses it - and enabling
# CONFIG_MCUX_COMPONENT_component.ele_base_api adds a second copy from
# components/ele_base_api/, which fails the link on duplicate symbols. The
# header is already on the include path, so including it is all that is needed.
